# TinyVMOS — image web-apache
#
# Apache2 seul. Aucun autre service, aucun interpréteur, aucun module
# superflu : c'est la première image du catalogue et elle sert de référence.

PACKAGES="apache2"
RC_SERVICES="apache2"

IMAGE_SIZE_MB=64

# Mesuré au démarrage sur la machine de développement. La machine cible étant
# plus faible, ce budget est une limite à tenir, pas une estimation.
MEMORY_BUDGET_MIB=256

DEFAULT_IP="10.42.10.2"
DEFAULT_PREFIX="24"
DEFAULT_GATEWAY="10.42.10.1"
